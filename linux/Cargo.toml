[package]
name = "calendar-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Calendar' window on Linux: GTK 4 and Libadwaita (Relm4), on Calendar' core and UUOB's SDK."

[[bin]]
name = "uuob-calendar"
path = "src/main.rs"

[dependencies]
calendar-core = { path = "../core" }
uuob-client = { path = "../sdk/client" }
uuob-kit-gtk = { path = "../sdk/kit/linux" }
# Libadwaita 1.5 (GNOME 46), as UUOB's own window.
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
serde_json = "1"
pangocairo = "0.22"
