[package]
name = "uuob-calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "uuob_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Calendar links people subscribe to (webcal://, Google's iCal address …),
# fetched outside the web view, which would block most of them.
tauri-plugin-http = "=2.8.3"
# Saving a calendar as an .ics file.
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
# The update address in tauri.conf.json is embedded as JSON.
serde_json = "1"
tauri-plugin-uuob-update = { path = "../../uuob/crates/uuob-update" }
tauri-plugin-uuob-sdk = { path = "../../uuob/crates/uuob-sdk" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
